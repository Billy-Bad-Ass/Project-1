name: Live data check

# Runs a real fetch against the upstream APIs and reports what came back.
#
# Separate from CI on purpose: CI stays offline and deterministic against
# committed fixtures, while this deliberately touches third-party services.
#
# On demand only. Firing it on every push would hammer free APIs that ask for
# reasonable use — the same courtesy the pipeline's own throttling and caching
# exist to provide. Run it when an adapter changes or a source looks wrong.
#
# Note: GitHub only offers workflow_dispatch for workflows present on the
# default branch, so this becomes runnable from the Actions tab once merged.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Items to fetch per source'
        default: '150'

jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      # Keep going if one API is down: a CheapShark outage should not hide the
      # Open Library result.
      fail-fast: false
      matrix:
        source: [cheapshark, openlibrary]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fetch live data (${{ matrix.source }})
        run: npm run data:build -- --limit ${{ github.event.inputs.limit || '150' }}
        env:
          SITE_SOURCE: ${{ matrix.source }}

      - name: Dataset report
        run: npm run data:stats

      - name: Sample real items
        run: npm run data:sample -- 4

      - name: Build the site from live data
        run: npm run build
        env:
          SITE_URL: https://example.com
          SITE_SOURCE: ${{ matrix.source }}

      - name: Verify build integrity
        run: npm run verify

      - name: Upload dataset
        uses: actions/upload-artifact@v5
        with:
          name: dataset-${{ matrix.source }}
          path: data/datasets/dataset.json
          retention-days: 14
