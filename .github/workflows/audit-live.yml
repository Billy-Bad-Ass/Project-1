name: Audit live sites

# Runs the audit engine against real websites. The dev sandbox blocks outside
# hosts, so this is the only way to find out what real HTML does to it.
#
# On demand only: it fetches strangers' servers, and firing that on every push
# would be rude and pointless.
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'Trade to look for'
        default: 'dentist'
      where:
        description: 'Town or city'
        default: 'Fairfax'
      country:
        description: 'ISO country code, to disambiguate the place name'
        default: 'US'
      limit:
        description: 'Maximum prospects'
        default: '40'
      top:
        description: 'How many audits to export for local drafting'
        default: '15'
      list:
        description: 'Prospect list file (audit job only)'
        default: 'prospects.example.txt'
      concurrency:
        description: 'Sites in flight at once'
        default: '2'

jobs:
  # Proves the discovery step works against the real Overpass API: turning a
  # trade and a town into an auditable prospect list is the claim that removes
  # the manual work, so it needs testing against the live service.
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - run: npm ci

      - name: Find real businesses
        run: |
          npm run find -- \
            --what "${{ github.event.inputs.what || 'dentist' }}" \
            --where "${{ github.event.inputs.where || 'Fairfax' }}" \
            --country "${{ github.event.inputs.country || 'US' }}" \
            --limit "${{ github.event.inputs.limit || '40' }}"

      - name: Assert the place resolved to somewhere real
        run: |
          set -e
          # Non-comment, non-blank. `grep -vc '^#'` counted the blank
          # separator line too, reporting 3 for a 2-prospect run — inflating
          # the very number this check exists to police.
          count=$(grep -v '^#' out/prospects.txt | grep -c '[^[:space:]]' || true)
          echo "found=$count"
          # A town with a trade in it has more than a couple. One or zero means
          # the name resolved to somewhere tiny or on the wrong continent —
          # exactly the Bristol-to-Tennessee bug this assertion exists to catch.
          if [ "$count" -lt 3 ]; then
            echo "Only $count prospects — the area probably resolved wrongly"
            exit 1
          fi

      - name: Show exactly who was found
        run: |
          echo '--- prospects.txt ---'
          cat out/prospects.txt
          echo
          echo '--- prospects.csv ---'
          cat out/prospects.csv 2>/dev/null || echo '(none)'

      - name: Audit what was found
        run: npm run audit -- --list out/prospects.txt --concurrency 2

      # Deliberately no drafting here. Drafts carry a real postal address and
      # opt-out, and those belong in a gitignored .env.local rather than in a
      # public repository's Actions logs. Discovery and auditing are the parts
      # that need the live network; drafting runs locally afterwards.

      - name: Show the outreach list
        run: head -60 out/leads.md

      # Drafting happens locally, because a draft carries a real postal address
      # and this repository is public. But the audits it needs can only be
      # produced here, where the network is reachable. This step is the bridge:
      # the top N audits, compressed and base64'd so they survive a log.
      - name: Export top audits for local drafting
        run: |
          node -e "
            const fs = require('fs');
            const all = JSON.parse(fs.readFileSync('out/audits.json', 'utf8'));
            const top = all
              .filter(a => !a.error)
              .sort((a, b) => b.opportunityScore - a.opportunityScore)
              .slice(0, Number(process.env.TOP || 15));
            fs.writeFileSync('out/audits-top.json', JSON.stringify(top));
            console.error('exported ' + top.length + ' of ' + all.length);
          "
          echo '===AUDITS_B64_BEGIN==='
          gzip -9 -c out/audits-top.json | base64 -w 200
          echo '===AUDITS_B64_END==='
        env:
          TOP: ${{ github.event.inputs.top || '15' }}

      - uses: actions/upload-artifact@v5
        with:
          name: discovery-run
          path: |
            audit/out/prospects.txt
            audit/out/prospects.csv
            audit/out/prospects.json
            audit/out/leads.md
            audit/out/audits.json
            audit/out/reports/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/package-lock.json

      - run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      - name: Audit real sites
        run: |
          npm run audit -- \
            --list "${{ github.event.inputs.list || 'prospects.example.txt' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '2' }}"

      - name: Show the outreach list
        run: cat out/leads.md

      - name: Sanity-check the output
        run: |
          set -e
          test -f out/audits.json
          # Every audited site must produce a report file, or the pipeline is
          # silently losing work the way the filename collision did.
          audited=$(node -e "const a=require('./out/audits.json');console.log(a.filter(x=>!x.error).length)")
          reports=$(ls out/reports/*.html 2>/dev/null | wc -l)
          echo "audited=$audited reports=$reports"
          if [ "$audited" -ne "$reports" ]; then
            echo "MISMATCH: $audited sites audited but $reports reports written"
            exit 1
          fi
          # A run where nothing was reachable means the engine, not the sites.
          if [ "$audited" -eq 0 ]; then
            echo "No site could be audited at all"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: live-audit-results
          path: |
            audit/out/reports/
            audit/out/leads.md
            audit/out/leads.csv
            audit/out/audits.json
          retention-days: 14
