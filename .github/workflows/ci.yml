name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds against committed fixtures so CI never depends on a third-party
      # API being up, and never spends free-tier quota.
      - name: Build with offline fixtures
        run: |
          npm run data:build -- --offline --limit 400
          npm run build
        env:
          SITE_URL: https://example.com

      # Fails the build on broken internal links, indexable pages missing from
      # the sitemap, or noindex pages leaking into it.
      - name: Verify build integrity
        run: npm run verify

      # A sub-directory deploy breaks differently from a root one, and the
      # difference is invisible locally, so build both ways.
      - name: Build and verify as a sub-directory deploy
        run: |
          rm -rf out .next
          npm run build
          npm run verify
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: /test-repo

  # The audit engine is its own package with its own dependencies, so it needs
  # its own install. The root job deliberately skips it.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Same reasoning as the audit job: its own package, its own lockfile, its own
  # install. It also runs on a different runtime — Workers, not Node — so a
  # dependency that only works under Node would pass here and fail on deploy.
  # The tests deliberately use nothing outside what both runtimes provide.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The Worker takes money and holds other people's opt-outs. A secret
      # pasted into the committed config would be readable by anyone, since
      # this repository is public.
      - name: No secrets in wrangler.toml
        run: |
          # Matches a prefix followed by an actual secret body. Matching the
          # bare prefix would fire on the file's own comment explaining which
          # secrets to set, which is documentation, not a leak.
          if grep -nE '(whsec_|sk_live_|sk_test_|rk_live_)[A-Za-z0-9]{16,}' wrangler.toml; then
            echo "::error::A secret is committed in wrangler.toml. Use 'wrangler secret put'."
            exit 1
          fi
          echo "wrangler.toml carries no secrets"
