name: Refresh and deploy

# Rebuilds the dataset from live APIs and redeploys. Runs on GitHub's free
# tier for public repositories.
on:
  schedule:
    # 04:15 UTC daily. Off the hour on purpose: scheduled jobs at :00 queue
    # behind everyone else's and get delayed.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to fetch'
        default: '600'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two refreshes deploy at once.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Exposed so the reporting job below can send the same start time the run
    # actually began at, rather than the time reporting happened to get to.
    outputs:
      started: ${{ steps.start.outputs.started }}
    steps:
      - uses: actions/checkout@v5

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Project 4's console owns the portfolio view. This repository keeps no
      # run log of its own — it posts what happened and stops. Until now it
      # posted nothing, so the console showed `dataset-refresh` as never having
      # run while this job went green every morning.
      - name: Tell the dashboard a run started
        uses: ./.github/actions/report-run
        with:
          agent: dataset-refresh
          project_slug: project-1
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          status: running
          started_at: ${{ steps.start.outputs.started }}
          summary: Rebuilding the dataset from live APIs.
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Persists the HTTP cache between runs so a re-run after a failure does
      # not re-spend rate-limited requests.
      - name: Restore API cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Build dataset from live APIs
        run: npm run data:build -- --limit ${{ github.event.inputs.limit || '600' }}
        env:
          SITE_SOURCE: ${{ vars.SITE_SOURCE }}

      - name: Dataset report
        run: npm run data:stats

      # A GitHub Pages project site is served from /<repo>/, so without a
      # basePath every link and asset resolves against the domain root and
      # 404s. Set the SITE_URL variable once you point a real domain at it and
      # the prefix drops away automatically.
      - name: Resolve site URL and base path
        id: site
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "url=${{ vars.SITE_URL }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ vars.BASE_PATH }}" >> "$GITHUB_OUTPUT"
            echo "Custom domain: ${{ vars.SITE_URL }}${{ vars.BASE_PATH }}"
          else
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            repo="${{ github.event.repository.name }}"
            # owner.github.io is a user site served from the root; every other
            # repo is a project site served from /<repo>/.
            if [ "$repo" = "$owner.github.io" ]; then
              echo "url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
              echo "base=" >> "$GITHUB_OUTPUT"
            else
              echo "url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
              echo "base=/$repo" >> "$GITHUB_OUTPUT"
            fi
            echo "No SITE_URL set; defaulting to the GitHub Pages URL."
          fi

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: ${{ steps.site.outputs.base }}
          AFFILIATES_ENABLED: ${{ vars.AFFILIATES_ENABLED }}
          AFF_FANATICAL: ${{ secrets.AFF_FANATICAL }}
          AFF_GMG: ${{ secrets.AFF_GMG }}
          AFF_HUMBLE: ${{ secrets.AFF_HUMBLE }}
          # Not secrets — they are public in the page source — so repo
          # variables rather than secrets, which keeps them readable in logs.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      # Catches a broken deploy before it ships rather than after.
      - name: Verify build integrity
        run: npm run verify
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: ${{ steps.site.outputs.base }}

      # The audit business site, published alongside at /audit/.
      #
      # Built here rather than committed because it carries a real postal
      # address and a live payment link. Those belong on the served page, not
      # in a public repository's history where code search indexes them.
      #
      # Skipped rather than fatal when the secrets are absent: a missing
      # setting must not take down the daily deploy of the other site.
      - name: Build the audit site
        id: audit_site
        env:
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          PRICE_DISPLAY: ${{ secrets.PRICE_DISPLAY }}
          AUDIT_POSTAL_ADDRESS: ${{ secrets.AUDIT_POSTAL_ADDRESS }}
          AUDIT_SENDER_BUSINESS: ${{ vars.AUDIT_SENDER_BUSINESS || 'BBA Network' }}
          AUDIT_SENDER_EMAIL: ${{ secrets.AUDIT_SENDER_EMAIL }}
          AUDIT_OPT_OUT_REPLY: 'Reply "stop" to this email and I will never contact you again.'
          AUDIT_LOCALE: en-US
          # A subdomain, not the apex. bbanetwork.org serves a different
          # business — the printable-guides storefront — and pointing this
          # site's canonical URL there invited search engines to treat two
          # unrelated businesses as one page. It did, briefly, until this.
          SITE_ORIGIN: ${{ vars.AUDIT_SITE_ORIGIN || 'https://audit.bbanetwork.org' }}
        run: |
          set -e
          missing=""
          for name in STRIPE_PAYMENT_LINK PRICE_DISPLAY AUDIT_POSTAL_ADDRESS AUDIT_SENDER_EMAIL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          # AUDIT_SENDER_EMAIL is in this list even though build:web treats it
          # as optional. Optional means the page builds without it; it does not
          # mean the page is fit to publish. Absent, the contact section of the
          # policy page renders as a blank name and an empty mailto: — a page
          # that takes money with no way to reach the seller.
          if [ -n "$missing" ]; then
            echo "::warning::Audit site skipped — secrets not set:$missing"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd audit
          npm ci
          npm run build:web
          mkdir -p ../out/audit
          cp -r out/site/. ../out/audit/
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Confirm the audit site published something real
        if: steps.audit_site.outputs.built == 'true'
        env:
          AUDIT_POSTAL_ADDRESS: ${{ secrets.AUDIT_POSTAL_ADDRESS }}
        run: |
          set -e
          test -f out/audit/index.html
          test -f out/audit/legal.html
          # A dead buy button is the failure this whole build guards against.
          grep -q 'buy.stripe.com' out/audit/index.html
          # And the two things a buyer needs in order to chase us afterwards.
          grep -qE 'mailto:[^"]+@[^"]+' out/audit/legal.html
          grep -qF "$AUDIT_POSTAL_ADDRESS" out/audit/legal.html
          echo "audit site: $(du -sh out/audit | cut -f1)"

      # Cloudflare Pages, in parallel with GitHub Pages rather than instead of
      # it. Two publishes of the same directory costs nothing and means the
      # domain cutover is a DNS change with a working site already behind it,
      # not a migration performed live.
      #
      # Deployed from here rather than by Cloudflare's git integration because
      # the build needs the payment link and postal address, and those are
      # GitHub Actions secrets. Handing them to a second build system would
      # mean two places to rotate them.
      - name: Publish the audit site to Cloudflare Pages
        if: steps.audit_site.outputs.built == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'bba-network' }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare Pages skipped — CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set."
            exit 0
          fi
          # Creating a project that already exists is an error, and it is the
          # expected one on every run after the first. A genuine problem still
          # surfaces: the deploy below is not tolerant of anything.
          npx --yes wrangler@3 pages project create "$PROJECT" \
            --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@3 pages deploy out/audit \
            --project-name "$PROJECT" --branch main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # A separate job, and it reports on `deploy` as well as `build`.
  #
  # A reporting step at the end of `build` would call the run a success while
  # the deploy that follows it was still to come — and a rebuilt dataset that
  # never reaches the site is exactly the failure worth hearing about. The cost
  # is one extra runner and a checkout; the alternative is a green tick for a
  # site that did not change.
  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report the outcome
        uses: ./.github/actions/report-run
        with:
          agent: dataset-refresh
          project_slug: project-1
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          started_at: ${{ needs.build.outputs.started }}
          status: >-
            ${{ (needs.build.result == 'success' && needs.deploy.result == 'success') && 'ok'
            || (needs.build.result == 'cancelled' || needs.deploy.result == 'cancelled') && 'skipped'
            || 'failed' }}
          summary: >-
            ${{ (needs.build.result == 'success' && needs.deploy.result == 'success')
            && 'Dataset rebuilt from live APIs and the site redeployed.'
            || needs.build.result != 'success'
            && format('Dataset build {0} — the site was not redeployed and is serving yesterday''s data.', needs.build.result)
            || format('Dataset rebuilt, but the deploy {0} — the site is still serving yesterday''s data.', needs.deploy.result) }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
